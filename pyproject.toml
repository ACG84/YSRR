[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "magnonic-nn"
version = "0.1.0"
description = "Differentiable magnonic physical neural network training simulator built on magnum.np"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "magnumnp>=2.2.0",
    "torch>=2.0",
    "numpy",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["magnonic_nn*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
